[workspace]
resolver = "2"
members = [
  ".",
  "crates/skill-core",
  "crates/skill-harness",
  "crates/skill-index",
  "crates/skill-local",
  "crates/skill-registry",
  "crates/skill-workspace",
]

[package]
name = "yssskills"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yssskills_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skill-core = { path = "crates/skill-core" }
skill-harness = { path = "crates/skill-harness" }
skill-index = { path = "crates/skill-index" }
skill-local = { path = "crates/skill-local" }
skill-registry = { path = "crates/skill-registry" }
skill-workspace = { path = "crates/skill-workspace" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
