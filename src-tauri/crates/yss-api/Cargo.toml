[package]
name = "yss-api"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skill-core = { path = "../skill-core" }
skill-harness = { path = "../skill-harness" }
skill-index = { path = "../skill-index" }
skill-local = { path = "../skill-local" }
skill-registry = { path = "../skill-registry" }
skill-workspace = { path = "../skill-workspace" }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
